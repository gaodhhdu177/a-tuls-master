<script>
/* A_TULS_DOMAIN_LOCK — ON */
(function(){
  try{
    var host=(location.hostname||'').toLowerCase();
    var proto=(location.protocol||'').toLowerCase();
    var ok=(
      host==='a-tuls-master-n0k1.onrender.com'||
      host.endsWith('.onrender.com')||
      host.endsWith('.pages.dev')||
      host.endsWith('.netlify.app')||
      host.endsWith('.vercel.app')||
      host.endsWith('.workers.dev')
    );
    if(proto==='file:'||!host||!ok){
      document.documentElement.innerHTML='<div style="font-family:system-ui,sans-serif;padding:48px 24px;text-align:center;background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center"><h1 style="margin:0;font-size:1.75rem">Access Denied</h1></div>';
      throw new Error('domain-lock');
    }
  }catch(e){ if(String(e.message||e)==='domain-lock') throw e; }
  try{
    document.addEventListener('contextmenu',function(e){e.preventDefault();return false},true);
    document.addEventListener('keydown',function(e){
      var k=e.key||'';
      if(k==='F12'){e.preventDefault();return false}
      if(e.ctrlKey&&e.shiftKey&&/^[ijcIJC]$/.test(k)){e.preventDefault();return false}
      if(e.ctrlKey&&/^[usUS]$/.test(k)){e.preventDefault();return false}
    },true);
    document.addEventListener('copy',function(e){
      try{
        var t=e.target,ok=t&&(/^(TEXTAREA|INPUT)$/.test(t.tagName)||(t.closest&&t.closest('textarea,input,pre,.api-key,#apiNewKey,[data-copy="1"]')));
        if(ok) return;
        var s=window.getSelection?String(window.getSelection()):'';
        if(s&&s.length>4000) e.preventDefault();
      }catch(err){}
    },true);
  }catch(err){}
})();
</script>

  };
  function applyTheme(id){
    var t=THEMES[id]||THEMES.midnight;
    var r=document.documentElement;
    r.style.setProperty('--bg',t.bg);
    r.style.setProperty('--panel',t.panel);

    try{ document.body.style.background=t.bg; document.body.style.color=t.txt; }catch(e){}
    localStorage.setItem('a_tuls_theme', id);
  }
  async function loadRemote(){
    try{
      var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
      var r=await fetch(SB_URL+"a_tuls_settings?or=(key.eq.site_theme,key.eq.site_notice,key.eq.paid_api_price,key.eq.site_time_note)&select=key,value",{headers:h});

<script>
/* ===== A-Tuls Database: Supabase (primary) =====
   শুধু HTML + Supabase। Mongo ফিল্ড খালি রাখুন — লাগবে না।
*/
window.A_TULS_DB = {
  // DB1 — Supabase (প্রাইমারি)
  SB_URL: 'https://phusizsdhsdjpcwijtti.supabase.co/rest/v1/',
  SB_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodXNpenNkaHNkanBjd2lqdHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTM5NzIsImV4cCI6MjEwMTk4OTk3Mn0.9Wpq11US4_LXE3RrgWzrF1RLZ0Vg3ouFNLXP0g5cQBs',
  // DB2 — MongoDB Atlas Data API (ব্যাকআপ / ২য় DB)
  // Atlas UI → App Services → Data API → Enable → URL + API Key বসান
  MONGO_API_URL: '', /* e.g. https://ap-south-1.aws.data.mongodb-api.com/app/data-xxxxx/endpoint/data/v1 */
  MONGO_API_KEY: '', /* Data API Key */
  MONGO_DATA_SOURCE: 'gourabadmin' /* Atlas cluster / data source name */,
  MONGO_DATABASE: 'atuls'
};
(function(){
  const C = window.A_TULS_DB;
  const SB_H = () => ({
    'apikey': C.SB_KEY,
    'Authorization': 'Bearer ' + C.SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal'
  });
  function mongoEnabled(){
    return !!(C.MONGO_API_URL && C.MONGO_API_KEY && C.MONGO_API_URL.indexOf('http')===0);
  }
  async function mongoAction(action, body){
    if(!mongoEnabled()) return null;
    try{
      const r = await fetch(C.MONGO_API_URL.replace(/\/$/,'') + '/action/' + action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'api-key': C.MONGO_API_KEY
        },
        body: JSON.stringify(Object.assign({
          dataSource: C.MONGO_DATA_SOURCE,
          database: C.MONGO_DATABASE
        }, body))
      });
      if(!r.ok){ console.warn('Mongo', action, r.status); return null; }
      return await r.json().catch(()=>({ok:true}));
    }catch(e){ console.warn('Mongo', e); return null; }
  }
  window.A_TULS = {
    sbHeaders: SB_H,
    async sbInsert(table, row){
      try{
        const r = await fetch(C.SB_URL + table, { method:'POST', headers: SB_H(), body: JSON.stringify(row) });
        return r.ok;
      }catch(e){ return false; }
    },
    async sbUpsert(table, filter, row){
      try{
        await fetch(C.SB_URL + table + '?' + filter, { method:'PATCH', headers: SB_H(), body: JSON.stringify(row) });
        await fetch(C.SB_URL + table, { method:'POST', headers: Object.assign({}, SB_H(), {'Prefer':'resolution=merge-duplicates,return=minimal'}), body: JSON.stringify(row) });
        return true;
      }catch(e){ return false; }
    },
    async sbGet(table, qs){
      try{
        const r = await fetch(C.SB_URL + table + (qs||''), { headers: SB_H() });
        if(!r.ok) return null;
        return await r.json();
      }catch(e){ return null; }
    },
    /** দুই DB-তে একসাথে সেভ */
    async dualInsert(collection, row){
      const a = await this.sbInsert(collection, row);
      const b = await mongoAction('insertOne', { collection: collection, document: row });
      return { supabase: !!a, mongo: !!b };
    },
    async dualUpsert(collection, idField, idVal, row){
      const a = await this.sbUpsert(collection, idField + '=eq.' + encodeURIComponent(idVal), row);
      const filter = {}; filter[idField] = idVal;
      const b = await mongoAction('updateOne', {
        collection: collection,
        filter: filter,
        update: { $set: row },
        upsert: true
      });
      return { supabase: !!a, mongo: !!b };
    },
    /** সেশন চেক — লগইন ছাড়া কাজ নয় */
    requireSession(redirect){
      try{
        const s = JSON.parse(localStorage.getItem('a_tuls_session')||'null');
        if(!s || !s.email){
          location.replace(redirect || 'index.html');
          return null;
        }
        const last = +localStorage.getItem('a_tuls_last_active') || Date.now();
        if(Date.now() - last > 30*60*1000){
          localStorage.removeItem('a_tuls_session');
          location.replace('login.html');
          return null;
        }
        localStorage.setItem('a_tuls_last_active', String(Date.now()));
        return s;
      }catch(e){
        location.replace(redirect || 'index.html');
        return null;
      }
    },
    async logLogin(userObj){
      const ua = navigator.userAgent || '';
      let browser = 'Unknown', os = 'Unknown';
      if(/Edg\//.test(ua)) browser='Edge'; else if(/Chrome\//.test(ua)) browser='Chrome'; else if(/Firefox\//.test(ua)) browser='Firefox'; else if(/Safari\//.test(ua)) browser='Safari';
      if(/Windows/.test(ua)) os='Windows'; else if(/Android/.test(ua)) os='Android'; else if(/iPhone|iPad/.test(ua)) os='iOS'; else if(/Mac OS/.test(ua)) os='Mac'; else if(/Linux/.test(ua)) os='Linux';
      const row = {
        user_id: String(userObj.id||''),
        username: userObj.username||'',
        email: userObj.email||'',
        device: /Mobile|Android|iPhone|iPad/i.test(ua) ? 'Mobile' : 'Desktop',
        browser: browser, os: os, ua: ua.slice(0,180),
        time: new Date().toISOString()
      };
      try{
        let logs = JSON.parse(localStorage.getItem('a_tuls_login_logs')||'[]');
        logs.unshift(row);
        localStorage.setItem('a_tuls_login_logs', JSON.stringify(logs.slice(0,200)));
      }catch(e){}
      // দুই DB-তে লগইন লগ
      await this.dualInsert('a_tuls_login_logs', row);
      return row;
    }
  };
})();
</script>

</head>

<div class="shell">
  <div class="brand">
    <img src="logo.png" alt="A-Tuls" style="width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 12px;border:2px solid rgba(0,229,255,.35)">
    <h1>Create A-Tuls account</h1>
    <p>Join the tools community</p>
    <div class="pill"><i class="fas fa-gift"></i> Free registration with API code</div>
  </div>
  <div class="card">
    <form id="signupForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="Choose a username" required>
      </div>
      <div class="field">
        <label>Email (Gmail)</label>
        <input type="email" id="email" placeholder="name@gmail.com" required>
      </div>
      <div class="field">
        <label>Gender</label>
        <select id="gender" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="field">
        <label>API Code *</label>
        <input type="text" id="apiCode" placeholder="API key from admin" required>
        <div class="hint">Valid API code required to sign up</div>
      </div>
      <div class="field">
        <label>WhatsApp</label>
        <input type="text" id="whatsapp" placeholder="01XXXXXXXXX">
      </div>
      <div class="field">
        <label>Telegram</label>
        <input type="text" id="telegram" placeholder="@username">
      </div>
      <div class="row2">
        <div class="field">
          <label>Security question</label>
          <select id="sq" required>
            <option value="" disabled selected>Select</option>
            <option>What is your mother's maiden name?</option>
            <option>What was the name of your first pet?</option>
            <option>What was your first car?</option>
            <option>What is your favorite movie?</option>
          </select>
        </div>
        <div class="field">
          <label>Answer</label>
          <input type="text" id="sa" placeholder="Answer" required>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Min 6 characters" required>
          <button type="button" class="eye" onclick="togglePass('password',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <div class="input-wrap">
          <input type="password" id="confirm" placeholder="Re-enter password" required>
          <button type="button" class="eye" onclick="togglePass('confirm',this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn">Create account</button>
    </form>
    <div class="foot">Already registered? <a href="login.html">Sign in</a></div>
  </div>
  <div class="home"><a href="index.html"><i class="fas fa-arrow-left"></i> Home</a></div>
</div>
<script>
const SB_URL = 'https://phusizsdhsdjpcwijtti.supabase.co/rest/v1/';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodXNpenNkaHNkanBjd2lqdHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTM5NzIsImV4cCI6MjEwMTk4OTk3Mn0.9Wpq11US4_LXE3RrgWzrF1RLZ0Vg3ouFNLXP0g5cQBs';
const SB_H = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

document.getElementById('signupForm').onsubmit = async function(e){
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const conf = document.getElementById('confirm').value;
  const apiCode = document.getElementById('apiCode').value.trim().replace(/\s+/g,'');
  if(pass !== conf){ alert('Passwords do not match'); return; }
  if(pass.length < 6){ alert('Password min 6 characters'); return; }
  if(!apiCode){ alert('API Code required!'); return; }

  // 1) Cloud API keys (all devices)
  let validKey = null;
  try{
    const r = await fetch(SB_URL+'a_tuls_api_keys?key=eq.'+encodeURIComponent(apiCode)+'&select=*', {headers:SB_H});
    if(r.ok){
      const rows = await r.json();
      if(rows && rows[0]){
        const k = rows[0];
        if(!k.expires || new Date(k.expires) > new Date()) validKey = {key:k.key,type:k.type||'free',userId:k.user_id,username:k.username,id:k.id};
      }
    }
  }catch(err){}

  // 2) Local fallback
  if(!validKey){
    const keys = JSON.parse(localStorage.getItem('a_tuls_api_keys')||'[]');
    validKey = keys.find(k => (k.key||'').trim().replace(/\s+/g,'') === apiCode && (!k.expires || new Date(k.expires) > new Date())) || null;
  }

  if(!validKey){
    alert('Wrong API Code!\n\nEnter a valid API Code or buy a package from Membership.\n\n* Copy the key generated from Admin Panel.');
    return;
  }

  // One API = one Signup only
  const linked = validKey.userId || validKey.user_id || '';
  if(linked && !String(linked).startsWith('invite_')){
    alert('This API Code is already used.\n\nOne API key allows only one Signup.\nAsk Admin for a new key.');
    return;
  }

  // Check existing user (cloud + local)
  let users = JSON.parse(localStorage.getItem('a_tuls_users')||'[]');
  try{
    const r = await fetch(SB_URL+'a_tuls_users?or=(email.eq.'+encodeURIComponent(email)+',username.eq.'+encodeURIComponent(username)+')&select=id', {headers:SB_H});
    if(r.ok){ const exist=await r.json(); if(exist&&exist.length){ alert('Username or email already exists'); return; } }
  }catch(err){}
  if(users.find(u => u.email === email || u.username === username)){
    alert('Username or email already exists'); return;
  }

  const apiType = validKey.type || 'free';
  const pkg = apiType === 'paid' ? 'Basic' : 'Free';
  const user = {
    id: Date.now().toString(),
    username, email,
    gender: document.getElementById('gender').value,
    api_code: apiCode,
    api_type: apiType,
    whatsapp: document.getElementById('whatsapp').value.trim(),
    telegram: document.getElementById('telegram').value.trim(),
    security_question: document.getElementById('sq').value,
    security_answer: document.getElementById('sa').value.trim(),
    password: pass,
    package: pkg,
    role: 'user',
    fb: '',
    created: new Date().toISOString()
  };

  // Save user to cloud
  try{
    await fetch(SB_URL+'a_tuls_users', {method:'POST', headers:SB_H, body:JSON.stringify(user)});
  }catch(err){}

  // Link API key to user in cloud
  if(validKey.id){
    try{
      await fetch(SB_URL+'a_tuls_api_keys?id=eq.'+validKey.id, {method:'PATCH', headers:SB_H, body:JSON.stringify({user_id:user.id,username:username})});
    }catch(err){}
  }

  users.push(user);
  localStorage.setItem('a_tuls_users', JSON.stringify(users));
  localStorage.setItem('a_tuls_session', JSON.stringify({id:user.id,username,email,role:'user',package:pkg}));
  localStorage.setItem('a_tuls_role', 'user');
  localStorage.setItem('a_tuls_profile', JSON.stringify({name:username,gmail:email,whatsapp:user.whatsapp,telegram:user.telegram,facebook:''}));
  alert('Account created! Going to dashboard...');
  window.location.href = 'dashboard.html';
};

function togglePass(id, btn){
  const inp=document.getElementById(id);
  if(!inp) return;
  if(inp.type==='password'){ inp.type='text'; if(btn) btn.innerHTML='<i class="fas fa-eye-slash"></i>'; }
  else { inp.type='password'; if(btn) btn.innerHTML='<i class="fas fa-eye"></i>'; }
}
</script>
