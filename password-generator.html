<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Ultra Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --text: #0f172a;
            --muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: 
                radial-gradient(ellipse at 15% 20%, rgba(13, 148, 136, 0.16) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 80%, rgba(245, 158, 11, 0.1) 0%, transparent 50%),
                linear-gradient(160deg, #f8fafc 0%, #f1f5f9 40%, #ecfdf5 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 24px 16px 50px;
        }

        .container { max-width: 640px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
        }

        .header h1 {
            font-size: clamp(1.8rem, 5vw, 2.3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p { color: var(--muted); font-size: 15px; }

        .main-card {
            background: rgba(255,255,255,0.93);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            padding: 28px;
        }

        .section-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .section-title i {
            width: 26px;
            height: 26px;
            background: #ccfbf1;
            color: #0d9488;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13.5px;
            font-weight: 500;
        }

        .option-item:hover { border-color: #14b8a6; }
        .option-item:has(input:checked) {
            border-color: #14b8a6;
            background: #f0fdfa;
            color: #0d9488;
            font-weight: 600;
        }

        .option-item input {
            accent-color: #0d9488;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .length-box { margin-bottom: 24px; }

        .length-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .length-value {
            background: #0d9488;
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 50px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 10px;
            background: #e2e8f0;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0d9488;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }

        @media (max-width: 500px) {
            .settings-row { grid-template-columns: 1fr; }
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            background: #f8fafc;
            cursor: pointer;
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #14b8a6;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4);
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px -5px rgba(13, 148, 136, 0.5);
        }

        .btn-generate:active { transform: scale(0.98); }

        .strength-box {
            margin-top: 20px;
            display: none;
        }

        .strength-bar {
            height: 8px;
            border-radius: 10px;
            background: #e2e8f0;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease, background 0.4s ease;
        }

        .strength-text {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-box {
            margin-top: 24px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 18px;
            padding: 18px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-weight: 700;
            font-size: 14px;
        }

        .result-count {
            background: #0d9488;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 50px;
        }

        #passwordOutput {
            width: 100%;
            min-height: 160px;
            max-height: 320px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: white;
            font-family: 'Courier New', monospace;
            font-size: 13.5px;
            line-height: 1.55;
            resize: vertical;
            color: var(--text);
        }

        .copy-btn {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .copy-btn:hover { filter: brightness(1.1); }

        .message {
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 500;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .message.show { display: flex; }
        .message.success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .footer-note {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<script>
(function(){
  var s = JSON.parse(localStorage.getItem('a_tuls_session')||'null');
  if(!s){ alert('Please login first!'); location.replace('login.html'); return; }
  if(s.role === 'admin') return;
  var pkg = s.package || 'Free';
  if(pkg !== 'Free') return; // paid package OK
  var keys = JSON.parse(localStorage.getItem('a_tuls_api_keys')||'[]');
  var myKeys = keys.filter(function(k){ return k.userId === s.id && new Date(k.expires) > new Date(); });
  var paidApi = myKeys.find(function(k){ return (k.type||'free') === 'paid'; });
  if(paidApi) return;
  var freeApi = myKeys.find(function(k){ return (k.type||'free') === 'free'; });
  if(freeApi){
    alert('Free API দিয়ে টুল চালানো যায় না।
Paid Package কিনুন বা Admin থেকে Paid API নিন।');
    location.replace('membership.html');
    return;
  }
  var apiIn = prompt('API Key দিন (Paid API প্রয়োজন):');
  if(!apiIn){ alert('API Key required!'); location.replace('membership.html'); return; }
  var valid = keys.find(function(k){ return k.key === apiIn.trim() && new Date(k.expires) > new Date(); });
  if(!valid){
    alert('Wrong API Key!');
    location.replace('membership.html');
    return;
  }
  if((valid.type||'free') === 'free'){
    alert('Free API দিয়ে টুল চালানো যায় না। Paid API নিন।');
    location.replace('membership.html');
    return;
  }
})();
</script>

    <div class="container">
        <div class="header">
            <div class="badge"><i class="fas fa-crown"></i> PREMIUM VERSION</div>
            <h1>Password Generator</h1>
            <p>Generate strong & customizable passwords instantly</p>
        </div>

        <div class="main-card">
            <!-- Character Types -->
            <div class="section-title"><i class="fas fa-font"></i> Character Types</div>
            <div class="options-grid">
                <label class="option-item">
                    <input type="checkbox" id="lowercase" checked> Lowercase (a-z)
                </label>
                <label class="option-item">
                    <input type="checkbox" id="uppercase" checked> Uppercase (A-Z)
                </label>
                <label class="option-item">
                    <input type="checkbox" id="numbers" checked> Numbers (0-9)
                </label>
                <label class="option-item">
                    <input type="checkbox" id="special"> Special (!@#$...)
                </label>
            </div>

            <!-- Length -->
            <div class="section-title"><i class="fas fa-ruler-horizontal"></i> Password Length</div>
            <div class="length-box">
                <div class="length-header">
                    <span style="font-size:13px; color:var(--muted);">6 — 32 characters</span>
                    <span class="length-value" id="lengthDisplay">12</span>
                </div>
                <input type="range" id="length" min="6" max="32" value="12">
            </div>

            <!-- Quantity & Format -->
            <div class="settings-row">
                <div class="form-group">
                    <label>How many passwords? (Max 1000)</label>
                    <input type="number" id="quantity" value="10" min="1" max="1000">
                </div>
                <div class="form-group">
                    <label>Password Format</label>
                    <select id="format">
                        <option value="default">Default (Random)</option>
                        <option value="dash">xxx-xxx-xxx</option>
                        <option value="slash">xxx/xxx/xxx</option>
                        <option value="underscore">xxx_xxx_xxx</option>
                        <option value="at">xxx@xxx@xxx</option>
                        <option value="hash">xxx#xxx#xxx</option>
                        <option value="email">Random@gtools.com</option>
                        <option value="phone">Numbers Only</option>
                    </select>
                </div>
            </div>

            <button class="btn-generate" id="generateBtn">
                <i class="fas fa-cogs"></i> Generate Passwords
            </button>

            <!-- Strength -->
            <div class="strength-box" id="strengthBox">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText">
                    <i class="fas fa-shield-alt"></i> Strength: —
                </div>
            </div>

            <!-- Result -->
            <div class="result-box" id="resultBox" style="display:none;">
                <div class="result-header">
                    <div class="result-title">Generated Passwords</div>
                    <div class="result-count" id="resultCount">0</div>
                </div>
                <textarea id="passwordOutput" readonly></textarea>
                <button class="copy-btn" id="copyBtn">
                    <i class="fas fa-copy"></i> Copy All Passwords
                </button>
            </div>

            <div class="message" id="messageBox"></div>
        </div>

        <div class="footer-note">100% Client-side • Max 1000 passwords at once</div>
    </div>

    <script>
        const lengthSlider = document.getElementById('length');
        const lengthDisplay = document.getElementById('lengthDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const passwordOutput = document.getElementById('passwordOutput');
        const resultBox = document.getElementById('resultBox');
        const resultCount = document.getElementById('resultCount');
        const strengthBox = document.getElementById('strengthBox');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const messageBox = document.getElementById('messageBox');
        const copyBtn = document.getElementById('copyBtn');

        lengthSlider.addEventListener('input', () => {
            lengthDisplay.textContent = lengthSlider.value;
        });

        const chars = {
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            numbers: '0123456789',
            special: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        function generatePassword(length, charset, format) {
            if (format === 'phone') {
                let pass = '';
                for (let i = 0; i < length; i++) {
                    pass += '0123456789'[Math.floor(Math.random() * 10)];
                }
                return pass;
            }

            if (format === 'email') {
                let user = '';
                const pool = chars.lowercase + chars.uppercase + chars.numbers;
                for (let i = 0; i < Math.max(8, length - 11); i++) {
                    user += pool[Math.floor(Math.random() * pool.length)];
                }
                return user + '@gtools.com';
            }

            let pass = '';
            for (let i = 0; i < length; i++) {
                pass += charset[Math.floor(Math.random() * charset.length)];
            }

            if (['dash', 'slash', 'underscore', 'at', 'hash'].includes(format)) {
                const sep = { dash: '-', slash: '/', underscore: '_', at: '@', hash: '#' }[format];
                const partLen = Math.floor(length / 3) || 1;
                const parts = [];
                for (let i = 0; i < pass.length; i += partLen) {
                    parts.push(pass.slice(i, i + partLen));
                }
                return parts.join(sep);
            }

            return pass;
        }

        function getStrength(password) {
            let score = 0;
            if (password.length >= 8) score += 20;
            if (password.length >= 12) score += 20;
            if (password.length >= 16) score += 15;
            if (/[a-z]/.test(password)) score += 15;
            if (/[A-Z]/.test(password)) score += 15;
            if (/[0-9]/.test(password)) score += 15;
            if (/[^a-zA-Z0-9]/.test(password)) score += 20;

            if (score < 40) return { percent: score, label: 'Weak', color: '#ef4444' };
            if (score < 70) return { percent: score, label: 'Medium', color: '#f59e0b' };
            if (score < 90) return { percent: score, label: 'Strong', color: '#10b981' };
            return { percent: Math.min(score, 100), label: 'Very Strong', color: '#059669' };
        }

        generateBtn.addEventListener('click', () => {
            const length = parseInt(lengthSlider.value);
            let qty = parseInt(document.getElementById('quantity').value) || 1;

            // Maximum 1000
            if (qty > 1000) qty = 1000;
            if (qty < 1) qty = 1;

            const format = document.getElementById('format').value;

            let charset = '';
            if (document.getElementById('lowercase').checked) charset += chars.lowercase;
            if (document.getElementById('uppercase').checked) charset += chars.uppercase;
            if (document.getElementById('numbers').checked) charset += chars.numbers;
            if (document.getElementById('special').checked) charset += chars.special;

            if (!charset && format !== 'phone') {
                showMessage('Please select at least one character type', 'error');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';

            // Use setTimeout so UI updates before heavy loop
            setTimeout(() => {
                const passwords = [];
                for (let i = 0; i < qty; i++) {
                    passwords.push(generatePassword(length, charset, format));
                }

                passwordOutput.value = passwords.join('\n');
                resultCount.textContent = passwords.length;
                resultBox.style.display = 'block';

                const strength = getStrength(passwords[0]);
                strengthBox.style.display = 'block';
                strengthFill.style.width = strength.percent + '%';
                strengthFill.style.background = strength.color;
                strengthText.innerHTML = '<i class="fas fa-shield-alt"></i> Strength: <span style="color:' + strength.color + '">' + strength.label + '</span>';

                showMessage(`${passwords.length} password(s) generated successfully!`, 'success');

                generateBtn.disabled = false;
                generateBtn.innerHTML = '<i class="fas fa-cogs"></i> Generate Passwords';
            }, 50);
        });

        copyBtn.addEventListener('click', () => {
            if (!passwordOutput.value) return;
            navigator.clipboard.writeText(passwordOutput.value).then(() => {
                showMessage('All passwords copied to clipboard!', 'success');
            });
        });

        function showMessage(text, type = 'success') {
            messageBox.className = `message show ${type}`;
            messageBox.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${text}`;
            clearTimeout(window.msgTimeout);
            window.msgTimeout = setTimeout(() => messageBox.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
