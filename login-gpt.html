<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login · A-Tuls</title>
  <meta name="description" content="Smart tools workspace · Site access · Free tier available" />
  <meta name="theme-color" content="#030712" />
  <link rel="icon" href="logo-512.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #030712;
      --bg-card: rgba(10, 22, 45, 0.8);
      --cyan: #00e5ff;
      --cyan-bright: #67f0ff;
      --purple: #7c5cff;
      --text: #f0f7ff;
      --text-muted: #7a94b8;
      --border: rgba(0, 229, 255, 0.16);
      --success: #00e676;
      --danger: #ff5252;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Background */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -15%, rgba(0, 100, 180, 0.22), transparent),
        radial-gradient(ellipse 50% 40% at 90% 70%, rgba(100, 40, 180, 0.12), transparent),
        linear-gradient(180deg, #030712 0%, #060e1c 40%, #0a1428 100%);
      overflow: hidden;
      pointer-events: none;
    }
    .aurora {
      position: absolute;
      inset: -20% -10%;
      background:
        linear-gradient(115deg, transparent 30%, rgba(0, 229, 255, 0.07) 45%, transparent 60%),
        linear-gradient(65deg, transparent 40%, rgba(124, 92, 255, 0.06) 55%, transparent 70%);
      animation: auroraShift 18s ease-in-out infinite alternate;
      filter: blur(40px);
    }
    @keyframes auroraShift {
      0% { transform: translateX(-3%) rotate(-1deg); }
      100% { transform: translateX(3%) rotate(1deg); }
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.3;
      animation: orbFloat 24s ease-in-out infinite;
    }
    .orb.o1 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.48), transparent 70%);
      top: -60px; left: -40px;
    }
    .orb.o2 {
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(124, 92, 255, 0.38), transparent 70%);
      bottom: 4%; right: -50px;
      animation-delay: -8s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(22px, -26px); }
    }
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 15% 25%, #fff, transparent),
        radial-gradient(1px 1px at 40% 60%, #a8d8ff, transparent),
        radial-gradient(1.5px 1.5px at 70% 20%, #fff, transparent),
        radial-gradient(1px 1px at 85% 75%, #cff, transparent),
        radial-gradient(1.5px 1.5px at 25% 80%, #fff, transparent),
        radial-gradient(1px 1px at 55% 35%, #fff, transparent);
      opacity: 0.5;
    }

    .geo {
      position: absolute;
      border: 1px solid rgba(0,229,255,.22);
      background: linear-gradient(145deg, rgba(0,229,255,.05), rgba(124,92,255,.03));
      box-shadow: 0 0 24px rgba(0,229,255,.08);
      animation: geoFloat 14s ease-in-out infinite;
      pointer-events: none;
    }
    .geo.g1 { width: 60px; height: 60px; border-radius: 14px; top: 12%; left: 5%; }
    .geo.g2 { width: 36px; height: 36px; border-radius: 50%; top: 25%; right: 7%; animation-delay: -3s; border-color: rgba(124,92,255,.28); }
    .geo.g3 { width: 28px; height: 28px; border-radius: 8px; bottom: 20%; left: 10%; animation-delay: -6s; }
    @keyframes geoFloat {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(8deg); }
    }

    /* Layout – slightly larger page */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 16px 40px;
    }

    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: transform .25s ease;
    }
    .logo-link:hover { transform: scale(1.03); }
    .logo-link:active { transform: scale(.96); }
    .logo-img {
      width: 44px; height: 44px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(0,229,255,.28);
    }
    .logo-text {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 1px;
      background: linear-gradient(100deg, #00e5ff, #7c5cff, #00e5ff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: 0.25s ease;
    }
    .back-link:hover {
      color: var(--cyan);
      border-color: var(--border);
      background: rgba(0, 229, 255, 0.06);
      transform: translateY(-2px);
    }

    /* Auth card – larger */
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 22px;
      padding: 34px 30px 28px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        0 0 50px rgba(0, 229, 255, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
      overflow: hidden;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(26px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    .auth-card::before {
      content: "";
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 16px var(--cyan);
      opacity: .7;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.8px;
      color: var(--cyan);
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.22);
      padding: 5px 13px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    .auth-header h1 {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 25%, #00e5ff 75%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-header p { color: var(--text-muted); font-size: 0.9rem; }
    .auth-header .sub { font-size: 0.78rem; margin-top: 3px; opacity: 0.85; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .form-group input {
      width: 100%;
      padding: 14px 15px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(0, 229, 255, 0.18);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }
    .form-group input::placeholder { color: rgba(122, 148, 184, 0.5); }
    .form-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12), 0 0 20px rgba(0, 229, 255, 0.1);
      background: rgba(0, 0, 0, 0.48);
    }
    .form-group input.has-toggle { padding-right: 48px; }
    .toggle-pass {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      transition: 0.2s ease;
    }
    .toggle-pass:hover { color: var(--cyan); transform: translateY(-50%) scale(1.12); }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00e5ff, #00c4e0 50%, #7c5cff);
      background-size: 200% auto;
      color: #021018;
      font-weight: 700;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.32);
      margin-top: 4px;
      transition: all 0.25s ease;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      background-position: right center;
      box-shadow: 0 0 42px rgba(0, 229, 255, 0.45);
    }
    .btn-primary:active:not(:disabled) { transform: scale(.97); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .btn-auto {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: var(--cyan);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }
    .btn-auto:hover {
      background: rgba(0, 229, 255, 0.14);
      border-color: rgba(0, 229, 255, 0.42);
      transform: translateY(-2px);
    }
    .btn-auto:active { transform: scale(.97); }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .footer-links a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover { text-decoration: underline; color: var(--cyan-bright); }

    .error-msg, .success-msg {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.86rem;
      margin-bottom: 14px;
      line-height: 1.45;
      text-align: center;
    }
    .error-msg {
      background: rgba(255, 82, 82, 0.12);
      border: 1px solid rgba(255, 82, 82, 0.35);
      color: #ff8a80;
    }
    .error-msg.show { display: block; animation: shake 0.35s ease; }
    .success-msg {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #69f0ae;
    }
    .success-msg.show { display: block; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      border-radius: 22px;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--cyan); font-size: 0.9rem; }

    .hint {
      text-align: center;
      margin-top: 16px;
      font-size: 0.74rem;
      color: var(--text-muted);
      opacity: 0.85;
      line-height: 1.5;
    }

    /* ===== SMALL AI HEAD – bottom right corner ===== */
    .ai-corner {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform .25s ease;
    }
    .ai-corner:hover { transform: scale(1.06); }
    .ai-corner:active { transform: scale(.94); }

    .ai-mini {
      position: relative;
      width: 72px;
      height: 88px;
    }
    .ai-mini .face {
      position: absolute;
      inset: 0;
      border-radius: 46% 46% 38% 38% / 50% 50% 40% 40%;
      background: linear-gradient(165deg, rgba(8,26,46,.97), rgba(3,14,28,.98));
      border: 1.5px solid rgba(0,229,255,.4);
      box-shadow: 0 0 22px rgba(0,229,255,.25), 0 8px 20px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .ai-mini .eye {
      position: absolute;
      width: 14px; height: 7px;
      border-radius: 2px;
      top: 34%;
      background: rgba(0,8,18,.95);
      border: 1px solid rgba(0,229,255,.5);
      overflow: hidden;
    }
    .ai-mini .eye.l { left: 22%; }
    .ai-mini .eye.r { right: 22%; }
    .ai-mini .eye i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), #54ddff);
      box-shadow: 0 0 8px var(--cyan);
      animation: scan 2.8s ease-in-out infinite;
    }
    @keyframes scan {
      0%,100% { transform: scaleX(.3); opacity: .55; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    .ai-mini .dot {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: .45; }
      50% { opacity: 1; }
    }
    .ai-mini .bars {
      position: absolute;
      bottom: 18%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 10px;
    }
    .ai-mini .bars span {
      width: 2.5px;
      border-radius: 1px;
      background: var(--cyan);
      animation: bar 1.1s ease-in-out infinite;
    }
    .ai-mini .bars span:nth-child(1) { height: 4px; }
    .ai-mini .bars span:nth-child(2) { height: 7px; animation-delay: .12s; }
    .ai-mini .bars span:nth-child(3) { height: 10px; animation-delay: .24s; }
    .ai-mini .bars span:nth-child(4) { height: 6px; animation-delay: .36s; }
    .ai-mini .bars span:nth-child(5) { height: 4px; animation-delay: .48s; }
    @keyframes bar {
      0%,100% { transform: scaleY(.4); opacity: .5; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .ai-mini .ear {
      position: absolute;
      width: 8px; height: 20px;
      top: 32%;
      border-radius: 4px;
      background: rgba(0,229,255,.15);
      border: 1px solid rgba(0,229,255,.3);
    }
    .ai-mini .ear.l { left: -6px; }
    .ai-mini .ear.r { right: -6px; }

    .ai-tip {
      margin-top: 6px;
      font-size: 0.65rem;
      color: var(--cyan);
      opacity: .8;
      text-align: center;
      max-width: 90px;
      line-height: 1.3;
    }
    .speak-on {
      display: none;
      margin-top: 4px;
      font-size: 0.62rem;
      color: var(--cyan);
      background: rgba(0,229,255,.12);
      border: 1px solid rgba(0,229,255,.25);
      padding: 3px 8px;
      border-radius: 12px;
    }
    .speak-on.show { display: inline-block; }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 18px 22px; max-width: 100%; }
      .auth-header h1 { font-size: 1.35rem; }
      .top-bar { max-width: 100%; }
      .geo.g1 { display: none; }
      .ai-corner { bottom: 12px; right: 12px; }
      .ai-mini { width: 62px; height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-scene" aria-hidden="true">
    <div class="aurora"></div>
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="stars"></div>
    <div class="geo g1"></div>
    <div class="geo g2"></div>
    <div class="geo g3"></div>
  </div>

  <div class="page">
    <div class="top-bar">

        <div class="spinner"></div>

      <div class="auth-header">

        <h1>A-Tuls</h1>
        <p>Smart tools workspace</p>
        <p class="sub">Login to open Dashboard & tools</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" class="has-toggle" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in →</button>
      </form>

      <button type="button" class="btn-auto" id="autoLoginBtn">
        <span>⚡</span> Auto Login (Saved Account)
      </button>

      <div class="footer-links">
        No account? <a href="signup.html">Create one</a>
      </div>

      <p class="hint">
        পাসওয়ার্ড ভুলে গেলে Signup-এর সিকিউরিটি প্রশ্ন ব্যবহার করুন<br>
        বা Admin WhatsApp: +880 1336-489062
      </p>
    </div>
  </div>

  <!-- Small AI Head – fixed bottom-right corner -->
  <div class="ai-corner" id="aiHead" title="ক্লিক করুন – পুরো পেজের গাইড শুনুন">
    <div class="ai-mini">
      <div class="face">
        <div class="eye l"><i></i></div>
        <div class="eye r"><i></i></div>
        <div class="dot"></div>
        <div class="bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="ear l"></div>
      <div class="ear r"></div>
    </div>
    <div class="ai-tip">AI Guide<br>ক্লিক করুন</div>
    <div class="speak-on" id="speakingBadge">🔊 Speaking…</div>
  </div>

  }catch(e){}
})();

const submitBtn=document.getElementById('submitBtn');

togglePass.addEventListener('click',()=>{

  passwordInput.type=hide?'text':'password';

});

function showError(m){ errorMsg.textContent=m; errorMsg.classList.add('show'); successMsg.classList.remove('show'); }
function hideError(){ errorMsg.classList.remove('show'); }
function showSuccess(m){ successMsg.innerHTML=m; successMsg.classList.add('show'); errorMsg.classList.remove('show'); }

/* Female voice – full page guide */
function getFemaleVoice(){
  const voices=speechSynthesis.getVoices();
  const prefer=[
    v=>v.lang.startsWith('bn') && /female|woman|zira|susan|samantha|veena|kalpana/i.test(v.name),
    v=>v.lang.startsWith('bn'),
    v=>/female|woman|zira|susan|samantha|karen|moira|tessa|fiona|veena/i.test(v.name),
    v=>v.lang.startsWith('en') && /female|woman|zira|susan|samantha/i.test(v.name),
    v=>v.name.toLowerCase().includes('google') && v.lang.startsWith('en')
  ];
  for(const fn of prefer){
    const found=voices.find(fn);
    if(found) return found;
  }
  return voices.find(v=>v.lang.startsWith('en')) || voices[0] || null;
}

function speakGuide(){
  if(!window.speechSynthesis){
    showError('আপনার ব্রাউজারে স্পিচ সাপোর্ট নেই।');
    return;
  }
  speechSynthesis.cancel();

  const text =
    'হ্যালো! আমি এ-টুলস নিউরাল কোর। ' +
    'এই পেজে আপনি লগইন করতে পারবেন। ' +
    'উপরে আছে এ-টুলস লোগো এবং হোম বাটন। হোম বাটনে ক্লিক করলে মূল পেজে যাবেন। ' +
    'ইমেইল বক্সে আপনার ইমেইল লিখুন। ' +
    'পাসওয়ার্ড বক্সে পাসওয়ার্ড দিন। চোখের আইকনে ক্লিক করলে পাসওয়ার্ড দেখা যাবে। ' +
    'সাইন ইন বাটনে ক্লিক করলে লগইন হবে এবং ড্যাশবোর্ডে চলে যাবেন। ' +
    'অটো লগইন বাটনে ক্লিক করলে আগে সেভ করা ইমেইল ও পাসওয়ার্ড দিয়ে সরাসরি লগইন হবে। ' +
    'যদি কোনো সেভ করা অ্যাকাউন্ট না থাকে তাহলে ফেইল মেসেজ দেখাবে। ' +
    'নিচে আছে ক্রিয়েট ওয়ান লিংক। নতুন অ্যাকাউন্ট বানাতে চাইলে সেখানে ক্লিক করুন। ' +
    'ধন্যবাদ। সুন্দর দিন কাটুক।';

  const u=new SpeechSynthesisUtterance(text);
  u.lang='bn-BD';
  u.rate=0.9;
  u.pitch=1.28;
  u.volume=1;

  const voice=getFemaleVoice();
  if(voice) u.voice=voice;

  speakingBadge.classList.add('show');
  u.onend=()=>speakingBadge.classList.remove('show');
  u.onerror=()=>speakingBadge.classList.remove('show');
  speechSynthesis.speak(u);
}

if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>{};
}

document.getElementById('aiHead').addEventListener('click', speakGuide);

/* Login */
async function pushLog(user,email){
  try{
    var ua=navigator.userAgent||'';
    var row={user_id:String(user.id||''),username:user.username||'',email:user.email||email,device:(/Mobile|Android|iPhone|iPad/i.test(ua)?'Mobile':'Desktop'),ua:ua.slice(0,180),time:new Date().toISOString()};
    try{var logs=JSON.parse(localStorage.getItem('a_tuls_login_logs')||'[]');logs.unshift(row);localStorage.setItem('a_tuls_login_logs',JSON.stringify(logs.slice(0,200)));}catch(_e){}
    await fetch(SB_URL+'a_tuls_login_logs',{method:'POST',headers:Object.assign({},SB_H,{'Prefer':'return=minimal'}),body:JSON.stringify(row)}).catch(function(){});
  }catch(e){}
}

async function doLogin(email,password,isAuto){
  hideError();
  submitBtn.disabled=true;
  loadingOverlay.classList.add('show');
  loadingText.textContent=isAuto?'Auto Login…':'Signing in…';

  var u=null;
  try{
    var r=await fetch(SB_URL+'a_tuls_users?or=(email.eq.'+encodeURIComponent(email)+',username.eq.'+encodeURIComponent(email)+')&select=*',{headers:SB_H});
    if(r.ok){var rows=await r.json();u=(rows||[]).find(function(x){return x.password===password;})||null;}
  }catch(ex){}
  if(!u){
    try{var users=JSON.parse(localStorage.getItem('a_tuls_users')||'[]');u=users.find(function(x){return (x.email===email||x.username===email)&&x.password===password;});}catch(ex){}
  }
  if(!u){
    loadingOverlay.classList.remove('show');
    submitBtn.disabled=false;
    showError(isAuto?'Auto Login failed — কোনো সেভ করা অ্যাকাউন্ট পাওয়া যায়নি।':'Invalid email or password.');
    return;
  }

  var sess={id:u.id,username:u.username,email:u.email,role:u.role||'user',package:u.package||'Free',profile_pic:u.profile_pic||'',package_expires:u.package_expires||'',whatsapp:u.whatsapp||'',telegram:u.telegram||''};
  localStorage.setItem('a_tuls_session',JSON.stringify(sess));
  localStorage.setItem('a_tuls_role',sess.role);
  localStorage.setItem('a_tuls_last_active',String(Date.now()));
  if(!isAuto){
    try{localStorage.setItem('a_tuls_saved_login',JSON.stringify({email:email,password:password}));}catch(e){}
  }
  try{await pushLog(sess,email);}catch(e){}

  loadingText.textContent='Loading Dashboard…';
  showSuccess('✅ Login successful!<br>Redirecting…');
  setTimeout(function(){window.location.href=(sess.role==='admin')?'admin.html':'dashboard.html';},700);
}

form.addEventListener('submit',function(e){
  e.preventDefault();
  hideError();
  var email=document.getElementById('email').value.trim().toLowerCase();
  var password=passwordInput.value;
  if(!email||!email.includes('@')){showError('সঠিক ইমেইল ঠিকানা দিন।');return;}
  if(!password||password.length<6){showError('Password কমপক্ষে ৬ অক্ষরের হতে হবে।');return;}
  doLogin(email,password,false);
});

autoLoginBtn.addEventListener('click',function(){
  hideError();
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('a_tuls_saved_login')||'null');}catch(e){}
  if(!saved||!saved.email||!saved.password){
    showError('Auto Login failed — কোনো সেভ করা Gmail বা Password পাওয়া যায়নি। আগে একবার ম্যানুয়ালি লগইন করুন।');
    return;
  }
  document.getElementById('email').value=saved.email;
  passwordInput.value=saved.password;
  doLogin(saved.email,saved.password,true);
});
</script>
