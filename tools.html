<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools</title>
    <style>
        :root {
            --primary-accent: #00e5ff;
            --primary-rgb: 0, 229, 255;
            --secondary-accent: #3a86ff;
            --border-color: rgba(0, 229, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #030b16;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #fff;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(0, 229, 255, 0.05), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(58, 134, 255, 0.05), transparent 40%);
        }

        .feature-card {
            position: relative;
            width: 290px;
            height: 400px;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }

        .border-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            z-index: 0;
        }

        .card-border-animation {
            position: absolute;
            width: 170%;
            height: 170%;
            top: -35%; left: -35%;
            background: linear-gradient(90deg, transparent, var(--primary-accent), var(--secondary-accent), var(--primary-accent), transparent);
            animation: rotation_481 3200ms infinite linear;
        }

        @keyframes rotation_481 {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        /* Perfect corner ribbon - matches original AURA FFX style */
        .ribbon {
            position: absolute;
            width: 130px;
            height: 130px;
            overflow: hidden;
            top: 0;
            left: 0;
            z-index: 50;
            pointer-events: none;
            border-top-left-radius: 22px;
        }

        .ribbon span {
            position: absolute;
            display: block;
            width: 190px;
            padding: 9px 0;
            background: linear-gradient(90deg, #3a86ff, #00e5ff, #3a86ff);
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
            color: #02070f;
            font-weight: 800;
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            left: -50px;
            top: 26px;
            transform: rotate(-45deg);
            z-index: 2;
        }

        .ribbon::before {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            bottom: 0;
            left: 0;
            z-index: 1;
            box-shadow: 120px -120px #005a77;
            background: linear-gradient(45deg, #005a77 0%, #003a55 100%);
        }

        .card-inner {
            position: absolute;
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            background: linear-gradient(160deg, #050f1d, #02070f);
            border-radius: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 2.8rem 1.6rem 1.6rem;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(28px);
            z-index: -1;
            animation: floating 4.5s ease-in-out infinite alternate;
        }
        
        .circle-bottom {
            width: 130px;
            height: 130px;
            background-color: rgba(var(--primary-rgb), 0.22);
            bottom: -25px;
            left: -25px;
        }

        .circle-right {
            width: 110px;
            height: 110px;
            background-color: rgba(58, 134, 255, 0.22);
            top: 18%;
            right: -25px;
            animation-delay: -2.2s;
        }

        @keyframes floating {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-22px) scale(1.12); }
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(var(--primary-rgb), 0.08);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-accent);
            box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.15);
            margin: 0 auto 1.2rem;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.9rem;
            color: #fff;
            margin-bottom: 0.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .card-desc {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .loader-yasin {
            width: 42px;
            aspect-ratio: 1.154;
            position: relative;
            background: conic-gradient(
                from 120deg at 50% 64%,
                #0000,
                var(--primary-accent) 1deg 120deg,
                #0000 121deg
            );
            animation: l27-0 1.5s infinite cubic-bezier(0.3, 1, 0, 1);
            margin: 10px auto 20px;
            filter: drop-shadow(0 0 12px rgba(var(--primary-rgb), 0.55));
        }

        .loader-yasin:before,
        .loader-yasin:after {
            content: "";
            position: absolute;
            inset: 0;
            background: inherit;
            transform-origin: 50% 66%;
            animation: l27-1 1.5s infinite;
        }

        .loader-yasin:after {
            --s: -1;
        }

        @keyframes l27-0 {
            0%, 30% { transform: rotate(0); }
            70% { transform: rotate(120deg); }
            70.01%, 100% { transform: rotate(360deg); }
        }

        @keyframes l27-1 {
            0% {
                transform: rotate(calc(var(--s, 1) * 120deg)) translate(0);
            }
            30%, 70% {
                transform: rotate(calc(var(--s, 1) * 120deg))
                    translate(calc(var(--s, 1) * -5px), 10px);
            }
            100% {
                transform: rotate(calc(var(--s, 1) * 120deg)) translate(0);
            }
        }

        .open-btn {
            background: linear-gradient(90deg, var(--primary-accent), var(--secondary-accent));
            color: #02070f;
            padding: 0.9rem 1.6rem;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(var(--primary-rgb), 0.35);
            border: none;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }

        .open-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            transition: all 0.5s ease;
        }

        .open-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(var(--primary-rgb), 0.5);
        }

        .open-btn:hover::after {
            left: 100%;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="feature-card">
        <div class="border-wrapper">
            <div class="card-border-animation"></div>
        </div>
        
        <!-- Clean Ribbon -->
        <div class="ribbon">
            <span>FREE</span>
        </div>
        
        <div class="card-inner">
            <div class="circle circle-bottom"></div>
            <div class="circle circle-right"></div>
            
            <div>
                <div class="icon-wrapper">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </div>
                <h2 class="card-title">TOOLS</h2>
                <p class="card-desc">Premium utilities</p>
                <div class="loader-yasin"></div>
            </div>
            
            <button class="open-btn">
                OPEN
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
            </button>
        </div>
    </div>
<script>

  try{
    var host=(location.hostname||'').toLowerCase();
    if(!host || host==='localhost' || host==='127.0.0.1' || host==='0.0.0.0') return;
    // Always allow GitHub Pages (project or user site)
    if(host.indexOf('github.io')>=0 || host.indexOf('githubusercontent.com')>=0) return;
    var ok=[
      'a-tuls.com','www.a-tuls.com','atuls.pages.dev',
      'a-tuls-master-n0k1.onrender.com'
    ];
    if(ok.indexOf(host)>=0) return;
    var ends=[
      '.onrender.com','.pages.dev','.netlify.app','.vercel.app',
      '.workers.dev','.github.io','.gitlab.io','.surge.sh',
      '.web.app','.firebaseapp.com','.cloudflarepages.dev'

  }catch(e){}
})();
(function atulsApiLock(){
  try{
    var path=(location.pathname||'').toLowerCase();
    var base=path.split('/').pop()||'';
    var publicPages=['index.html','login.html','signup.html','membership.html','profile.html',''];
    if(publicPages.indexOf(base)>=0) return;
    var toolLike=/fixer|report|vault|checker|generator|timezone|vpn|temp-mail|2fa|ai-website|uid|bio-link|tools|email|password|name-gen|outside|gmail/i.test(base);
    if(!toolLike) return;
    function hasSession(){
      try{
        var s=JSON.parse(localStorage.getItem('a_tuls_session')||'null');

      }catch(e){ return false; }
    }
    if(hasSession()) return;
    document.addEventListener('DOMContentLoaded', function(){
      if(hasSession()) return;
      // GitHub Pages: still require login, but show clear message with relative login link
      var bar=document.createElement('div');
      bar.id='atulsApiLockBar';
      bar.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(3,7,18,.92);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui';
      bar.innerHTML='<div style="max-width:420px;background:#0b1220;border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:28px;color:#e2e8f0"><div style="font-size:28px;margin-bottom:8px">🔐</div><h2 style="margin:0 0 8px;color:#67e8f9">Login required</h2><p style="opacity:.8;font-size:14px;line-height:1.5">GitHub Pages / Render — tools open after login on this same link.</p><a href="login.html" style="display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:linear-gradient(90deg,#00e5ff,#3b82f6);color:#041018;font-weight:700;text-decoration:none">Go to Login</a></div>';
      document.body.appendChild(bar);
    });
  }catch(e){}
})();
</script></body>
</html>
