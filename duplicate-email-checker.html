    localStorage.setItem('a_tuls_last_active', String(Date.now()));
    document.addEventListener('click', function(){ localStorage.setItem('a_tuls_last_active', String(Date.now())); });
  } catch(e){ location.replace('index.html'); }
})();

    <script>
        const emailInput = document.getElementById('emailInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const checkBtn = document.getElementById('checkBtn');
        const clearBtn = document.getElementById('clearBtn');
        const messageBox = document.getElementById('messageBox');
        const statsBar = document.getElementById('statsBar');
        const resultsSection = document.getElementById('resultsSection');
        const uniqueList = document.getElementById('uniqueList');
        const dupList = document.getElementById('dupList');
        const uniqueBadge = document.getElementById('uniqueBadge');
        const dupBadge = document.getElementById('dupBadge');
        const inputCount = document.getElementById('inputCount');
        const copyUniqueBtn = document.getElementById('copyUniqueBtn');
        const copyDupBtn = document.getElementById('copyDupBtn');

        // Live line counter
        emailInput.addEventListener('input', () => {
            const lines = emailInput.value.split('\n').filter(l => l.trim() !== '').length;
            inputCount.textContent = lines + (lines === 1 ? ' line' : ' lines');
        });

        // Paste
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                emailInput.value = text;
                emailInput.dispatchEvent(new Event('input'));
                showMessage('Successfully pasted from clipboard!', 'success');
            } catch (err) {
                showMessage('Could not access clipboard. Please paste manually (Ctrl+V).', 'error');
            }
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            emailInput.value = '';
            uniqueList.value = '';
            dupList.value = '';
            uniqueBadge.textContent = '0';
            dupBadge.textContent = '0';
            statsBar.style.display = 'none';
            resultsSection.style.display = 'none';
            inputCount.textContent = '0 lines';
            hideMessage();
        });

        // Helpers: keep password + full row (Sheets style)
        function extractEmail(line) {
            var m = String(line || '').match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
            return m ? m[0].toLowerCase() : null;
        }
        function toSheetsRow(line) {
            // email + password + rest → tab-separated for Google Sheets paste
            var s = String(line || '').replace(/\r/g, '').trim();
            if (!s) return '';
            s = s.replace(/\t+/g, '\t');
            // if already has tabs, keep
            if (s.indexOf('\t') >= 0) return s;
            // split on 2+ spaces or | or :
            var parts = s.split(/\s{2,}|[|]+/).map(function(p){ return p.trim(); }).filter(Boolean);
            if (parts.length >= 2) return parts.join('\t');
            // email then single-space password
            var m = s.match(/^(\S*@\S+)\s+(.+)$/);
            if (m) return m[1] + '\t' + m[2];
            return s;
        }
        function mergeBrokenLines(raw) {
            var lines = String(raw || '').split(/\r?\n/);
            var out = [], buf = '';
            function hasEmail(s){ return /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(s||''); }
            for (var i=0;i<lines.length;i++){
                var t = lines[i].replace(/\t+/g,'  ').trim();
                if (!t) continue;
                if (hasEmail(t)){ if(buf) out.push(buf); buf = t; }
                else { buf = buf ? (buf + '  ' + t) : t; }
            }
            if (buf) out.push(buf);
            return out;
        }

        // Main Check — duplicate by EMAIL only, keep full row (password safe)
        checkBtn.addEventListener('click', () => {
            const raw = emailInput.value.trim();
            if (!raw) {
                showMessage('Please enter some emails first.', 'error');
                return;
            }

            const rows = mergeBrokenLines(raw);
            if (!rows.length) {
                showMessage('No valid emails found.', 'error');
                return;
            }

            // email -> { count, firstFullRow }
            const map = {};
            const order = [];
            rows.forEach(function(line){
                const em = extractEmail(line);
                if (!em) return;
                if (!map[em]) {
                    map[em] = { count: 0, row: toSheetsRow(line) };
                    order.push(em);
                }
                map[em].count += 1;
                // keep longer row (more fields / password)
                var cand = toSheetsRow(line);
                if (cand.length > map[em].row.length) map[em].row = cand;
            });

            const unique = [];
            const duplicates = [];
            order.forEach(function(em){
                var item = map[em];
                if (item.count === 1) unique.push(item.row);
                else duplicates.push(item.row + '\t×' + item.count);
            });

            uniqueList.value = unique.length ? unique.join('\n') : 'None';
            dupList.value = duplicates.length ? duplicates.join('\n') : 'None';

            uniqueBadge.textContent = unique.length;
            dupBadge.textContent = duplicates.length;

            document.getElementById('totalCount').textContent = rows.length;
            document.getElementById('uniqueCount').textContent = unique.length;
            document.getElementById('dupCount').textContent = duplicates.length;

            statsBar.style.display = 'grid';
            resultsSection.style.display = 'grid';

            if (duplicates.length === 0) {
                showMessage('Perfect! No duplicate emails found.', 'success');
            } else {
                showMessage('Found ' + duplicates.length + ' duplicate email(s). Passwords kept.', 'info');
            }
        });

        // Copy
        copyUniqueBtn.addEventListener('click', () => {
            if (!uniqueList.value || uniqueList.value === 'None') {
                showMessage('Nothing to copy.', 'error');
                return;
            }
            navigator.clipboard.writeText(uniqueList.value).then(() => {
                showMessage('Unique emails copied to clipboard!', 'success');
            });
        });

        copyDupBtn.addEventListener('click', () => {
            if (!dupList.value || dupList.value === 'None') {
                showMessage('Nothing to copy.', 'error');
                return;
            }
            navigator.clipboard.writeText(dupList.value).then(() => {
                showMessage('Duplicate emails copied to clipboard!', 'success');
            });
        });

        function showMessage(text, type = 'info') {
            messageBox.className = `message show ${type}`;
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
            messageBox.innerHTML = `<i class="fas fa-${icon}"></i> ${text}`;
            
            clearTimeout(window.msgTimeout);
            window.msgTimeout = setTimeout(hideMessage, 4000);
        }

        function hideMessage() {
            messageBox.classList.remove('show');
        }

        // Keyboard shortcut
        emailInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                checkBtn.click();
            }
        });
    </script>
</body>
</html>
