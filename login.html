<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | A-Tuls Community</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --p: #0f766e; --p2: #14b8a6; --dark: #0f172a; --muted: #64748b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(135deg, #f0fdfa, #f8fafc);
  color: var(--dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.auth-card {
  background: #fff;
  border-radius: 20px;
  padding: 30px 24px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 10px 30px rgba(15,118,110,.08);
  border: 1px solid #e2e8f0;
}
.site-logo {
  width: 90px; height: 90px; border-radius: 50%; position: relative;
  display: flex; justify-content: center; align-items: center; margin: 0 auto 16px;
  background: radial-gradient(circle,#10294b 0%,#06101f 45%,#010308 100%);
  border: 3px solid #ffc62b;
  box-shadow: 0 0 10px #00aaff, 0 0 20px rgba(0,140,255,.4);
}
.site-logo:before {
  content: ""; position: absolute; width: 78px; height: 78px; border-radius: 50%;
  border: 2px solid #00b7ff; box-shadow: 0 0 8px #009dff;
}
.site-logo .crown { position: absolute; top: 4px; font-size: 16px; color: #ffd329; text-shadow: 0 0 6px #ff9d00; }
.site-logo .letter { position: absolute; top: 16px; font-family: Georgia,serif; font-size: 42px; font-weight: bold; font-style: italic; color: white; text-shadow: 2px 2px 0 #006cff, -1px -1px 0 #00c8ff; }
.site-logo .name { position: absolute; top: 52px; font-family: Georgia,serif; font-size: 14px; font-weight: bold; font-style: italic; color: #ffc62b; text-shadow: 1px 1px 0 #714600; }
.site-logo .orbit { position: absolute; width: 70px; height: 18px; border: 3px solid #00baff; border-right-color: #ffc62b; border-radius: 50%; transform: rotate(-15deg); }
.form-label { font-weight: 600; font-size: 0.85rem; color: var(--dark); }
.form-control {
  border-radius: 12px; padding: 12px; font-size: 0.9rem;
  border: 1.5px solid #e2e8f0;
}
.form-control:focus {
  border-color: var(--p);
  box-shadow: 0 0 0 3px rgba(15,118,110,.12);
}
.btn-auth {
  width: 100%; background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: #fff; border: none; padding: 12px; border-radius: 12px;
  font-weight: 700; font-size: 0.95rem; margin-top: 10px;
  box-shadow: 0 4px 14px rgba(15,118,110,.3);
}
.btn-auth:hover { filter: brightness(1.05); color: #fff; }
.auth-foot { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
.auth-foot a { color: var(--p); font-weight: 650; }
.back-home { text-align: center; margin-top: 15px; font-size: 0.85rem; }
.back-home a { color: var(--muted); }
.error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 5px; display: none; }
</style>
</head>
<body>

<div class="auth-card">
  <a href="index.html" style="text-decoration:none">
    <div class="site-logo">
      <div class="crown">♛</div>
      <div class="letter">A</div>
      <div class="orbit"></div>
      <div class="name">-tuls</div>
    </div>
  </a>
  <h4 style="font-weight: 800; font-size: 1.25rem; text-align: center; margin-bottom: 6px;">Welcome Back!</h4>
  <p style="text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 24px;">Please login to your account</p>
  
  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group">
      <input type="password" class="form-control" id="loginPass" placeholder="••••••••" required>
      <button type="button" class="btn btn-outline-secondary" tabindex="-1" onclick="togglePass('loginPass',this)"><i class="fas fa-eye"></i></button>
    </div>
      <div id="loginError" class="error-msg">Invalid email or password!</div>
    </div>
    <button type="submit" class="btn-auth">Login Now</button>
  </form>

  <div class="auth-foot">
    Don't have an account? <a href="signup.html">Sign Up</a>
  </div>
</div>

<div class="back-home">
  <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
</div>

<script>
const SB_URL = 'https://phusizsdhsdjpcwijtti.supabase.co/rest/v1/';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodXNpenNkaHNkanBjd2lqdHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTM5NzIsImV4cCI6MjEwMTk4OTk3Mn0.9Wpq11US4_LXE3RrgWzrF1RLZ0Vg3ouFNLXP0g5cQBs';
const SB_H = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  if(email === 'gourabmon112233@gmail.com' && pass === 'goUrab@2008') {
    localStorage.setItem('a_tuls_session', JSON.stringify({id:'admin',username:'Gourab',email:email,role:'admin',package:'Lifetime'}));
      try{
        var logs=JSON.parse(localStorage.getItem('a_tuls_login_logs')||'[]');
        logs.unshift({user:u.username||u.email,email:u.email,time:new Date().toISOString(),ua:navigator.userAgent.slice(0,120),device:(/Mobile|Android|iPhone/i.test(navigator.userAgent)?'Mobile':'Desktop')});
        localStorage.setItem('a_tuls_login_logs', JSON.stringify(logs.slice(0,200)));
        localStorage.setItem('a_tuls_last_active', String(Date.now()));
      }catch(e){}

    localStorage.setItem('a_tuls_role', 'admin');
    window.location.href = 'admin.html';
    return;
  }
  // Cloud users (সব ডিভাইস)
  let u = null;
  try{
    const r = await fetch(SB_URL+'a_tuls_users?or=(email.eq.'+encodeURIComponent(email)+',username.eq.'+encodeURIComponent(email)+')&select=*', {headers:SB_H});
    if(r.ok){
      const rows = await r.json();
      u = (rows||[]).find(x => x.password === pass) || null;
    }
  }catch(err){}
  // Local fallback
  if(!u){
    const users = JSON.parse(localStorage.getItem('a_tuls_users')||'[]');
    u = users.find(x => (x.email === email || x.username === email) && x.password === pass);
  }
  if(!u){ err.style.display = 'block'; return; }
  localStorage.setItem('a_tuls_session', JSON.stringify({id:u.id,username:u.username,email:u.email,role:u.role||'user',package:u.package||'Free'}));
  localStorage.setItem('a_tuls_role', u.role||'user');
  window.location.href = 'dashboard.html';
}
</script>
</body>
</html>
