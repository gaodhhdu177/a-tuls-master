<script>
/* A_TULS_DOMAIN_LOCK — ON */
(function(){
  try{
    var host=(location.hostname||'').toLowerCase();
    var proto=(location.protocol||'').toLowerCase();
    var ok=(
      host==='a-tuls-master-n0k1.onrender.com'||
      host.endsWith('.onrender.com')||
      host.endsWith('.pages.dev')||
      host.endsWith('.netlify.app')||
      host.endsWith('.vercel.app')||
      host.endsWith('.workers.dev')
    );
    if(proto==='file:'||!host||!ok){
      document.documentElement.innerHTML='<div style="font-family:system-ui,sans-serif;padding:48px 24px;text-align:center;background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center"><h1 style="margin:0;font-size:1.75rem">Access Denied</h1></div>';
      throw new Error('domain-lock');
    }
  }catch(e){ if(String(e.message||e)==='domain-lock') throw e; }
  try{
    document.addEventListener('contextmenu',function(e){e.preventDefault();return false},true);
    document.addEventListener('keydown',function(e){
      var k=e.key||'';
      if(k==='F12'){e.preventDefault();return false}
      if(e.ctrlKey&&e.shiftKey&&/^[ijcIJC]$/.test(k)){e.preventDefault();return false}
      if(e.ctrlKey&&/^[usUS]$/.test(k)){e.preventDefault();return false}
    },true);
    document.addEventListener('copy',function(e){
      try{
        var t=e.target,ok=t&&(/^(TEXTAREA|INPUT)$/.test(t.tagName)||(t.closest&&t.closest('textarea,input,pre,.api-key,#apiNewKey,[data-copy="1"]')));
        if(ok) return;
        var s=window.getSelection?String(window.getSelection()):'';
        if(s&&s.length>4000) e.preventDefault();
      }catch(err){}
    },true);
  }catch(err){}
})();
</script>

  var local=localStorage.getItem('a_tuls_theme')||'midnight';
  applyTheme(local);
  loadRemote();
  setInterval(loadRemote, 60000);

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · A-Tuls</title>
<meta name="theme-color" content="#1e1b4b">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#0b1020; --bg1:#12182b; --card:#161d33;
  --line:rgba(255,255,255,.08); --txt:#e8ecf8; --mut:#8b93b0;
  --acc:#6366f1; --acc2:#8b5cf6; --ok:#22c55e; --bad:#f43f5e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background: radial-gradient(1200px 600px at 10% -10%, #312e81 0%, transparent 55%),
              radial-gradient(900px 500px at 100% 0%, #4c1d95 0%, transparent 50%),
              var(--bg0);
  color:var(--txt); display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px 16px;
}
.shell{width:100%; max-width:420px}
.brand{text-align:center; margin-bottom:22px}
.mark{
  width:72px; height:72px; margin:0 auto 12px; border-radius:20px;
  background:linear-gradient(145deg,#6366f1,#a855f7);
  display:grid; place-items:center; font-weight:800; font-size:1.6rem; color:#fff;
  box-shadow:0 12px 40px rgba(99,102,241,.45);
}
.brand h1{font-size:1.35rem; font-weight:800; letter-spacing:-.02em}
.brand p{color:var(--mut); font-size:.9rem; margin-top:4px}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent), var(--card);
  border:1px solid var(--line); border-radius:24px; padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
label{display:block; font-size:.8rem; font-weight:600; color:var(--mut); margin:0 0 6px}
.field{margin-bottom:14px}
.input-wrap{position:relative}
input{
  width:100%; background:var(--bg1); border:1px solid var(--line); color:var(--txt);
  border-radius:14px; padding:13px 44px 13px 14px; font-size:.95rem; outline:none;
  font-family:inherit;
}
input:focus{border-color:var(--acc); box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.eye{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  background:transparent; border:0; color:var(--mut); width:36px; height:36px; cursor:pointer;
  border-radius:10px;
}
.eye:hover{color:var(--txt); background:rgba(255,255,255,.06)}
.btn{
  width:100%; margin-top:8px; border:0; cursor:pointer; font-family:inherit;
  background:linear-gradient(135deg, var(--acc), var(--acc2));
  color:#fff; font-weight:700; font-size:.95rem; padding:14px; border-radius:14px;
  box-shadow:0 10px 28px rgba(99,102,241,.35);
}
.btn:hover{filter:brightness(1.06)}
.err{color:var(--bad); font-size:.82rem; margin-top:6px; display:none}
.foot{text-align:center; margin-top:18px; font-size:.88rem; color:var(--mut)}
.foot a{color:#a5b4fc; font-weight:600; text-decoration:none}
.home{text-align:center; margin-top:16px}
.home a{color:var(--mut); text-decoration:none; font-size:.85rem}
.pill{
  display:inline-flex; align-items:center; gap:6px; margin-top:10px;
  background:rgba(34,197,94,.12); color:#4ade80; border:1px solid rgba(34,197,94,.25);
  font-size:.75rem; font-weight:700; padding:5px 10px; border-radius:999px;
}
</style>
<script>
/* ===== A-Tuls Database: Supabase (primary) =====
   শুধু HTML + Supabase। Mongo ফিল্ড খালি রাখুন — লাগবে না।
*/
window.A_TULS_DB = {
  // DB1 — Supabase (প্রাইমারি)
  SB_URL: 'https://phusizsdhsdjpcwijtti.supabase.co/rest/v1/',
  SB_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodXNpenNkaHNkanBjd2lqdHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTM5NzIsImV4cCI6MjEwMTk4OTk3Mn0.9Wpq11US4_LXE3RrgWzrF1RLZ0Vg3ouFNLXP0g5cQBs',
  // DB2 — MongoDB Atlas Data API (ব্যাকআপ / ২য় DB)
  // Atlas UI → App Services → Data API → Enable → URL + API Key বসান
  MONGO_API_URL: '', /* e.g. https://ap-south-1.aws.data.mongodb-api.com/app/data-xxxxx/endpoint/data/v1 */
  MONGO_API_KEY: '', /* Data API Key */
  MONGO_DATA_SOURCE: 'gourabadmin' /* Atlas cluster / data source name */,
  MONGO_DATABASE: 'atuls'
};
(function(){
  const C = window.A_TULS_DB;
  const SB_H = () => ({
    'apikey': C.SB_KEY,
    'Authorization': 'Bearer ' + C.SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal'
  });
  function mongoEnabled(){
    return !!(C.MONGO_API_URL && C.MONGO_API_KEY && C.MONGO_API_URL.indexOf('http')===0);
  }
  async function mongoAction(action, body){
    if(!mongoEnabled()) return null;
    try{
      const r = await fetch(C.MONGO_API_URL.replace(/\/$/,'') + '/action/' + action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'api-key': C.MONGO_API_KEY
        },
        body: JSON.stringify(Object.assign({
          dataSource: C.MONGO_DATA_SOURCE,
          database: C.MONGO_DATABASE
        }, body))
      });
      if(!r.ok){ console.warn('Mongo', action, r.status); return null; }
      return await r.json().catch(()=>({ok:true}));
    }catch(e){ console.warn('Mongo', e); return null; }
  }
  window.A_TULS = {
    sbHeaders: SB_H,
    async sbInsert(table, row){
      try{
        const r = await fetch(C.SB_URL + table, { method:'POST', headers: SB_H(), body: JSON.stringify(row) });
        return r.ok;
      }catch(e){ return false; }
    },
    async sbUpsert(table, filter, row){
      try{
        await fetch(C.SB_URL + table + '?' + filter, { method:'PATCH', headers: SB_H(), body: JSON.stringify(row) });
        await fetch(C.SB_URL + table, { method:'POST', headers: Object.assign({}, SB_H(), {'Prefer':'resolution=merge-duplicates,return=minimal'}), body: JSON.stringify(row) });
        return true;
      }catch(e){ return false; }
    },
    async sbGet(table, qs){
      try{
        const r = await fetch(C.SB_URL + table + (qs||''), { headers: SB_H() });
        if(!r.ok) return null;
        return await r.json();
      }catch(e){ return null; }
    },
    /** দুই DB-তে একসাথে সেভ */
    async dualInsert(collection, row){
      const a = await this.sbInsert(collection, row);
      const b = await mongoAction('insertOne', { collection: collection, document: row });
      return { supabase: !!a, mongo: !!b };
    },
    async dualUpsert(collection, idField, idVal, row){
      const a = await this.sbUpsert(collection, idField + '=eq.' + encodeURIComponent(idVal), row);
      const filter = {}; filter[idField] = idVal;
      const b = await mongoAction('updateOne', {
        collection: collection,
        filter: filter,
        update: { $set: row },
        upsert: true
      });
      return { supabase: !!a, mongo: !!b };
    },
    /** সেশন চেক — লগইন ছাড়া কাজ নয় */
    requireSession(redirect){
      try{
        const s = JSON.parse(localStorage.getItem('a_tuls_session')||'null');
        if(!s || !s.email){
          location.replace(redirect || 'index.html');
          return null;
        }
        const last = +localStorage.getItem('a_tuls_last_active') || Date.now();
        if(Date.now() - last > 30*60*1000){
          localStorage.removeItem('a_tuls_session');
          location.replace('login.html');
          return null;
        }
        localStorage.setItem('a_tuls_last_active', String(Date.now()));
        return s;
      }catch(e){
        location.replace(redirect || 'index.html');
        return null;
      }
    },
    async logLogin(userObj){
      const ua = navigator.userAgent || '';
      let browser = 'Unknown', os = 'Unknown';
      if(/Edg\//.test(ua)) browser='Edge'; else if(/Chrome\//.test(ua)) browser='Chrome'; else if(/Firefox\//.test(ua)) browser='Firefox'; else if(/Safari\//.test(ua)) browser='Safari';
      if(/Windows/.test(ua)) os='Windows'; else if(/Android/.test(ua)) os='Android'; else if(/iPhone|iPad/.test(ua)) os='iOS'; else if(/Mac OS/.test(ua)) os='Mac'; else if(/Linux/.test(ua)) os='Linux';
      const row = {
        user_id: String(userObj.id||''),
        username: userObj.username||'',
        email: userObj.email||'',
        device: /Mobile|Android|iPhone|iPad/i.test(ua) ? 'Mobile' : 'Desktop',
        browser: browser, os: os, ua: ua.slice(0,180),
        time: new Date().toISOString()
      };
      try{
        let logs = JSON.parse(localStorage.getItem('a_tuls_login_logs')||'[]');
        logs.unshift(row);
        localStorage.setItem('a_tuls_login_logs', JSON.stringify(logs.slice(0,200)));
      }catch(e){}
      // দুই DB-তে লগইন লগ
      await this.dualInsert('a_tuls_login_logs', row);
      return row;
    }
  };
})();
</script>

</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="mark">A</div>
    <h1>A-Tuls</h1>
    <p>Smart tools workspace</p>
    <div class="pill"><i class="fas fa-unlock"></i> Site access · Free tier available</div>
  </div>
  <div class="card">
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="eye" onclick="togglePass('loginPass',this)" aria-label="Show password"><i class="fas fa-eye"></i></button>
        </div>
        <div id="loginError" class="err">Invalid email or password</div>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <div class="foot">No account? <a href="signup.html">Create one</a></div>

</div>
<script>
const SB_URL = 'https://phusizsdhsdjpcwijtti.supabase.co/rest/v1/';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodXNpenNkaHNkanBjd2lqdHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTM5NzIsImV4cCI6MjEwMTk4OTk3Mn0.9Wpq11US4_LXE3RrgWzrF1RLZ0Vg3ouFNLXP0g5cQBs';
const SB_H = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};

function togglePass(id, btn){
  const inp=document.getElementById(id);
  if(!inp) return;
  if(inp.type==='password'){ inp.type='text'; if(btn) btn.innerHTML='<i class="fas fa-eye-slash"></i>'; }
  else { inp.type='password'; if(btn) btn.innerHTML='<i class="fas fa-eye"></i>'; }
}
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  if(err) err.style.display = 'none';

  async function pushLoginLog(userObj){
    try{
      const ua = navigator.userAgent||'';
      let browser = 'Unknown', os = 'Unknown';
      if(/Edg\//.test(ua)) browser='Edge'; else if(/Chrome\//.test(ua)) browser='Chrome'; else if(/Firefox\//.test(ua)) browser='Firefox'; else if(/Safari\//.test(ua)) browser='Safari'; else if(/Opera|OPR\//.test(ua)) browser='Opera';
      if(/Windows/.test(ua)) os='Windows'; else if(/Android/.test(ua)) os='Android'; else if(/iPhone|iPad|iPod/.test(ua)) os='iOS'; else if(/Mac OS/.test(ua)) os='Mac'; else if(/Linux/.test(ua)) os='Linux';
      const row = {
        user_id: String(userObj.id||''),
        username: userObj.username||'',
        email: userObj.email||email,
        device: (/Mobile|Android|iPhone|iPad/i.test(ua)?'Mobile':'Desktop'),
        browser: browser,
        os: os,
        ua: ua.slice(0,180),
        time: new Date().toISOString()
      };
      try{
        let logs=JSON.parse(localStorage.getItem('a_tuls_login_logs')||'[]');
        logs.unshift(row);
        localStorage.setItem('a_tuls_login_logs', JSON.stringify(logs.slice(0,200)));
      }catch(_e){}
      localStorage.setItem('a_tuls_last_active', String(Date.now()));
      try{
        await fetch(SB_URL+'a_tuls_login_logs', {
          method:'POST',
          headers:Object.assign({},SB_H,{'Prefer':'return=minimal'}),
          body:JSON.stringify(row)
        });
      }catch(_e){}
      try{ if(window.A_TULS) await A_TULS.dualInsert('a_tuls_login_logs', row); }catch(_e){}
    }catch(ex){ console.warn('login log', ex); }
  }

  // ===== ADMIN LOGIN (hardcoded) =====
  if(email.toLowerCase() === 'gourabmon112233@gmail.com' && pass === 'goUrab@2008') {
    const adminSess = {id:'admin',username:'Gourab',email:email.toLowerCase(),role:'admin',package:'Lifetime',profile_pic:''};
    try{
      const r=await fetch(SB_URL+"a_tuls_users?id=eq.admin&select=*",{headers:SB_H});
      if(r.ok){
        const rows=await r.json();
        if(rows&&rows[0]){
          if(rows[0].profile_pic) adminSess.profile_pic=rows[0].profile_pic;
          if(rows[0].username) adminSess.username=rows[0].username;
        }
      }
    }catch(ex){}
    localStorage.setItem('a_tuls_last_active', String(Date.now()));
    localStorage.setItem('a_tuls_session', JSON.stringify(adminSess));
    localStorage.setItem('a_tuls_role', 'admin');
    if(adminSess.profile_pic) localStorage.setItem('a_tuls_profile_pic', adminSess.profile_pic);
    try{ await pushLoginLog(adminSess); }catch(ex){}
    window.location.href = 'admin.html';
    return;
  }

  // ===== NORMAL USER =====
  let u = null;
  try{
    const r = await fetch(SB_URL+'a_tuls_users?or=(email.eq.'+encodeURIComponent(email)+',username.eq.'+encodeURIComponent(email)+')&select=*', {headers:SB_H});
    if(r.ok){
      const rows = await r.json();
      u = (rows||[]).find(x => x.password === pass) || null;
    }
  }catch(ex){}
  if(!u){
    try{
      const users = JSON.parse(localStorage.getItem('a_tuls_users')||'[]');
      u = users.find(x => (x.email === email || x.username === email) && x.password === pass);
    }catch(ex){}
  }
  if(!u){
    if(err) err.style.display = 'block';
    return;
  }

  const sess = {
    id:u.id, username:u.username, email:u.email,
    role:u.role||'user', package:u.package||'Free',
    profile_pic:u.profile_pic||'',
    package_expires:u.package_expires||'',
    whatsapp:u.whatsapp||'', telegram:u.telegram||'', fb:u.fb||'', gmail:u.gmail||u.email||''
  };
  localStorage.setItem('a_tuls_last_active', String(Date.now()));
  localStorage.setItem('a_tuls_session', JSON.stringify(sess));
  localStorage.setItem('a_tuls_role', sess.role);
  if(sess.profile_pic) localStorage.setItem('a_tuls_profile_pic', sess.profile_pic);
  else localStorage.removeItem('a_tuls_profile_pic');
  localStorage.setItem('a_tuls_profile', JSON.stringify({
    name:sess.username, gmail:sess.gmail||sess.email,
    whatsapp:sess.whatsapp, telegram:sess.telegram, fb:sess.fb
  }));
  try{ await pushLoginLog(sess); }catch(ex){}
  window.location.href = (sess.role === 'admin') ? 'admin.html' : 'dashboard.html';
}
</script>
