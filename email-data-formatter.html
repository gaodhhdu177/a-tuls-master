<script>
(function(){
  try {
    var s = JSON.parse(localStorage.getItem('a_tuls_session')||'null');
    if(!s || !s.email){
      location.replace('index.html');
      return;
    }
    // idle 30 min -> re-login
    var last = +localStorage.getItem('a_tuls_last_active')||Date.now();
    if(Date.now()-last > 30*60*1000){
      localStorage.removeItem('a_tuls_session');
      location.replace('login.html');
      return;
    }
    localStorage.setItem('a_tuls_last_active', String(Date.now()));
    document.addEventListener('click', function(){ localStorage.setItem('a_tuls_last_active', String(Date.now())); });
  } catch(e){ location.replace('index.html'); }
})();
// Basic deterrents (not 100% secure — real lock needs Node backend)

document.addEventListener('keydown', function(e){
  if(e.key==='F12') e.preventDefault();
  if(e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='J'||e.key==='C')) e.preventDefault();
  if(e.ctrlKey && (e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')) e.preventDefault();
});
</script>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="header">
            <div class="badge">
                <i class="fas fa-crown"></i> PREMIUM VERSION
            </div>
            <h1>Email Data Formatter</h1>
            <p>Organize and format email data into clean, structured lines instantly</p>
        </div>

        <div class="main-card">
            <div class="card-body">

                <!-- Input Format -->
                <div class="section-label">
                    <i class="fas fa-list-ul"></i>
                    Select Input Format
                </div>
                <div class="select-wrapper">
                    <select id="inputType">
                        <option value="2">Email + Password (Side-by-side)</option>
                        <option value="3">Email + Password + Recovery (Side-by-side)</option>
                        <option value="2-split">Email + Password (Separate lines)</option>
                        <option value="3-split">Email + Password + Recovery (Separate lines)</option>
                    </select>
                </div>

                <!-- Input -->
                <div class="section-label">
                    <i class="fas fa-keyboard"></i>
                    Paste your raw data
                </div>
                <div class="textarea-container">
                    <textarea id="inputData" placeholder="Paste your data here according to the selected format..."></textarea>
                </div>
                <div class="line-info" id="inputCount">0 lines</div>

                <!-- Buttons -->
                <div class="btn-row">
                    <button class="btn btn-secondary" id="pasteBtn">
                        <i class="fas fa-paste"></i> Paste
                    </button>
                    <button class="btn btn-primary" id="formatBtn">
                        <i class="fas fa-magic"></i> Format Data
                    </button>
                    <button class="btn btn-danger" id="clearBtn">
                        <i class="fas fa-trash-alt"></i> Clear
                    </button>
                </div>

                <!-- Message -->
                <div class="message" id="messageBox"></div>

                <!-- Output -->
                <div class="output-section" id="outputSection" style="display: none;">
                    <div class="output-header">
                        <div class="output-title">
                            <i class="fas fa-check-double" style="color: #0d9488;"></i>
                            Formatted Output
                            <span class="count-badge" id="dataCount">0</span>
                        </div>
                        <button class="btn btn-outline" id="copyBtn">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                    </div>
                    <div class="textarea-container">
                        <textarea id="outputData" readonly placeholder="Formatted data will appear here..."></textarea>
                    </div>
                </div>

            </div>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-halved"></i>
            100% Private • Everything runs in your browser • No database
        </div>
    </div>

    <script>
        const inputData = document.getElementById('inputData');
        const inputType = document.getElementById('inputType');
        const pasteBtn = document.getElementById('pasteBtn');
        const formatBtn = document.getElementById('formatBtn');
        const clearBtn = document.getElementById('clearBtn');
        const messageBox = document.getElementById('messageBox');
        const outputSection = document.getElementById('outputSection');
        const outputData = document.getElementById('outputData');
        const dataCount = document.getElementById('dataCount');
        const copyBtn = document.getElementById('copyBtn');
        const inputCount = document.getElementById('inputCount');

        // Live line counter
        inputData.addEventListener('input', () => {
            const lines = inputData.value.split('\n').filter(l => l.trim() !== '').length;
            inputCount.textContent = lines + (lines === 1 ? ' line' : ' lines');
        });

        // Paste
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                inputData.value = text;
                inputData.dispatchEvent(new Event('input'));
                showMessage('Successfully pasted from clipboard!', 'success');
            } catch (err) {
                showMessage('Could not access clipboard. Please paste manually (Ctrl+V).', 'error');
            }
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            inputData.value = '';
            outputData.value = '';
            dataCount.textContent = '0';
            outputSection.style.display = 'none';
            inputCount.textContent = '0 lines';
            hideMessage();
        });

        // Format Logic
        formatBtn.addEventListener('click', () => {
            const raw = inputData.value.trim();
            if (!raw) {
                showMessage('Please enter some data first.', 'error');
                return;
            }

            const type = inputType.value;
            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
            let result = [];

            try {
                if (type === '2') {
                    // email:pass or email|pass or email pass
                    lines.forEach(line => {
                        const parts = line.split(/[:|\s]+/).filter(p => p);
                        if (parts.length >= 2) {
                            result.push(parts[0] + ':' + parts[1]);
                        }
                    });
                } 
                else if (type === '3') {
                    // email:pass:recovery
                    lines.forEach(line => {
                        const parts = line.split(/[:|\s]+/).filter(p => p);
                        if (parts.length >= 3) {
                            result.push(parts[0] + ':' + parts[1] + ':' + parts[2]);
                        } else if (parts.length === 2) {
                            result.push(parts[0] + ':' + parts[1] + ':');
                        }
                    });
                }
                else if (type === '2-split') {
                    // Email\nPassword\nEmail\nPassword...
                    for (let i = 0; i < lines.length; i += 2) {
                        if (lines[i + 1]) {
                            result.push(lines[i] + ':' + lines[i + 1]);
                        }
                    }
                }
                else if (type === '3-split') {
                    // Email\nPassword\nRecovery\nEmail...
                    for (let i = 0; i < lines.length; i += 3) {
                        if (lines[i + 1]) {
                            const recovery = lines[i + 2] || '';
                            result.push(lines[i] + ':' + lines[i + 1] + ':' + recovery);
                        }
                    }
                }

                if (result.length === 0) {
                    showMessage('Could not format any valid data. Check your input format.', 'error');
                    return;
                }

                outputData.value = result.join('\n');
                dataCount.textContent = result.length;
                outputSection.style.display = 'block';
                showMessage(`Successfully formatted ${result.length} entries!`, 'success');

            } catch (err) {
                showMessage('Something went wrong while formatting.', 'error');
            }
        });

        // Copy
        copyBtn.addEventListener('click', () => {
            if (!outputData.value) {
                showMessage('Nothing to copy.', 'error');
                return;
            }
            navigator.clipboard.writeText(outputData.value).then(() => {
                showMessage('Formatted data copied to clipboard!', 'success');
            });
        });

        function showMessage(text, type = 'info') {
            messageBox.className = `message show ${type}`;
            const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle';
            messageBox.innerHTML = `<i class="fas fa-${icon}"></i> ${text}`;
            clearTimeout(window.msgTimeout);
            window.msgTimeout = setTimeout(hideMessage, 4000);
        }

        function hideMessage() {
            messageBox.classList.remove('show');
        }

        // Ctrl + Enter
        inputData.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                formatBtn.click();
            }
        });
    </script>
</body>
