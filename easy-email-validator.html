    <script>
        const emailData = document.getElementById('emailData');
        const pasteBtn = document.getElementById('pasteBtn');
        const validateBtn = document.getElementById('validateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const messageBox = document.getElementById('messageBox');
        const resultsSection = document.getElementById('resultsSection');
        const validCount = document.getElementById('validCount');
        const invalidCount = document.getElementById('invalidCount');
        const validList = document.getElementById('validList');
        const invalidList = document.getElementById('invalidList');

        // Simple email regex
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        pasteBtn.addEventListener('click', async () => {
            try {
                emailData.value = await navigator.clipboard.readText();
                showMessage('Pasted successfully!', 'success');
            } catch {
                showMessage('Clipboard access failed. Paste manually.', 'error');
            }
        });

        clearBtn.addEventListener('click', () => {
            emailData.value = '';
            validList.value = '';
            invalidList.value = '';
            validCount.textContent = '0';
            invalidCount.textContent = '0';
            resultsSection.style.display = 'none';
            hideMessage();
        });

        validateBtn.addEventListener('click', () => {
            const raw = emailData.value.trim();
            if (!raw) {
                showMessage('Please enter some data first.', 'error');
                return;
            }

            const type = document.querySelector('input[name="emailType"]:checked').value;
            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l);

            const valid = [];
            const invalid = [];

            lines.forEach(line => {
                const parts = line.split(/[\s\t:|]+/).filter(p => p);

                let isValid = false;

                if (type === 'email') {
                    // Only Email
                    isValid = parts.length >= 1 && emailRegex.test(parts[0]);
                } 
                else if (type === 'emailPass') {
                    // Email + Password
                    isValid = parts.length >= 2 && emailRegex.test(parts[0]) && parts[1].length > 0;
                } 
                else if (type === 'emailPassRecovery') {
                    // Email + Password + Recovery
                    isValid = parts.length >= 3 && emailRegex.test(parts[0]) && parts[1].length > 0 && parts[2].length > 0;
                }

                if (isValid) {
                    valid.push(line);
                } else {
                    invalid.push(line);
                }
            });

            validCount.textContent = valid.length;
            invalidCount.textContent = invalid.length;

            validList.value = valid.length ? valid.join('\n') : 'None';
            invalidList.value = invalid.length ? invalid.join('\n') : 'None';

            resultsSection.style.display = 'block';

            showMessage(`Validation complete! Valid: ${valid.length} | Invalid: ${invalid.length}`, 'success');
        });

        document.getElementById('copyValid').addEventListener('click', () => {
            if (!validList.value || validList.value === 'None') {
                showMessage('Nothing to copy.', 'error');
                return;
            }
            navigator.clipboard.writeText(validList.value).then(() => {
                showMessage('Valid emails copied!', 'success');
            });
        });

        document.getElementById('copyInvalid').addEventListener('click', () => {
            if (!invalidList.value || invalidList.value === 'None') {
                showMessage('Nothing to copy.', 'error');
                return;
            }
            navigator.clipboard.writeText(invalidList.value).then(() => {
                showMessage('Invalid emails copied!', 'success');
            });
        });

        function showMessage(text, type = 'info') {
            messageBox.className = `message show ${type}`;
            const icon = type === 'success' ? 'check-circle' : 'exclamation-circle';
            messageBox.innerHTML = `<i class="fas fa-${icon}"></i> ${text}`;
            clearTimeout(window.msgTimeout);
            window.msgTimeout = setTimeout(hideMessage, 4000);
        }

        function hideMessage() {
            messageBox.classList.remove('show');
        }
    </script>

    if(!toolLike) return;
    function hasSession(){
      try{
        var s=JSON.parse(localStorage.getItem('a_tuls_session')||'null');
        return !!(s && (s.id||s.email||s.username));
      }catch(e){ return false; }
    }
    if(hasSession()) return;
    document.addEventListener('DOMContentLoaded', function(){
      if(hasSession()) return;
      // GitHub Pages: still require login, but show clear message with relative login link
      var bar=document.createElement('div');
      bar.id='atulsApiLockBar';
      bar.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(3,7,18,.92);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui';
      bar.innerHTML='<div style="max-width:420px;background:#0b1220;border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:28px;color:#e2e8f0"><div style="font-size:28px;margin-bottom:8px">🔐</div><h2 style="margin:0 0 8px;color:#67e8f9">Login required</h2><p style="opacity:.8;font-size:14px;line-height:1.5">GitHub Pages / Render — tools open after login on this same link.</p><a href="login.html" style="display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:linear-gradient(90deg,#00e5ff,#3b82f6);color:#041018;font-weight:700;text-decoration:none">Go to Login</a></div>';
      document.body.appendChild(bar);
    });
  }catch(e){}
})();
