<script>
/* A_TULS_DOMAIN_LOCK — ON */
(function(){
  try{
    var host=(location.hostname||'').toLowerCase();
    var proto=(location.protocol||'').toLowerCase();
    var ok=(
      host==='a-tuls-master-n0k1.onrender.com'||
      host.endsWith('.onrender.com')||
      host.endsWith('.pages.dev')||
      host.endsWith('.netlify.app')||
      host.endsWith('.vercel.app')||
      host.endsWith('.workers.dev')
    );
    if(proto==='file:'||!host||!ok){
      document.documentElement.innerHTML='<div style="font-family:system-ui,sans-serif;padding:48px 24px;text-align:center;background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center"><h1 style="margin:0;font-size:1.75rem">Access Denied</h1></div>';
      throw new Error('domain-lock');
    }
  }catch(e){ if(String(e.message||e)==='domain-lock') throw e; }
  try{
    document.addEventListener('contextmenu',function(e){e.preventDefault();return false},true);
    document.addEventListener('keydown',function(e){
      var k=e.key||'';
      if(k==='F12'){e.preventDefault();return false}
      if(e.ctrlKey&&e.shiftKey&&/^[ijcIJC]$/.test(k)){e.preventDefault();return false}
      if(e.ctrlKey&&/^[usUS]$/.test(k)){e.preventDefault();return false}
    },true);
    document.addEventListener('copy',function(e){
      try{
        var t=e.target,ok=t&&(/^(TEXTAREA|INPUT)$/.test(t.tagName)||(t.closest&&t.closest('textarea,input,pre,.api-key,#apiNewKey,[data-copy="1"]')));
        if(ok) return;
        var s=window.getSelection?String(window.getSelection()):'';
        if(s&&s.length>4000) e.preventDefault();
      }catch(err){}
    },true);
  }catch(err){}
})();
</script>

<script>
(function domainLock(){
  try{
    var host=(location.hostname||'').toLowerCase();
    if(!host || host==='localhost' || host==='127.0.0.1' || host==='0.0.0.0') return;
    // Always allow GitHub Pages (project or user site)
    if(host.indexOf('github.io')>=0 || host.indexOf('githubusercontent.com')>=0) return;
    var ok=[
      'a-tuls.com','www.a-tuls.com','atuls.pages.dev',
      'a-tuls-master-n0k1.onrender.com'
    ];
    if(ok.indexOf(host)>=0) return;
    var ends=[
      '.onrender.com','.pages.dev','.netlify.app','.vercel.app',
      '.workers.dev','.github.io','.gitlab.io','.surge.sh',
      '.web.app','.firebaseapp.com','.cloudflarepages.dev'
    ];
    if(ends.some(function(e){return host.endsWith(e);})) return;
    document.documentElement.innerHTML='<body style="background:#030712;color:#e2e8f0;font-family:system-ui;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px"><div><h1 style="color:#ff5577">🔒 Domain Locked</h1><p>Use Render / GitHub Pages / Netlify / Vercel host.</p><p style="opacity:.6;font-size:12px">WhatsApp +880 1336-489062</p></div></body>';
  }catch(e){}
})();
(function atulsApiLock(){
  try{
    var path=(location.pathname||'').toLowerCase();
    var base=path.split('/').pop()||'';
    var publicPages=['index.html','login.html','signup.html','membership.html','profile.html',''];
    if(publicPages.indexOf(base)>=0) return;
    var toolLike=/fixer|report|vault|checker|generator|timezone|vpn|temp-mail|2fa|ai-website|uid|bio-link|tools|email|password|name-gen|outside|gmail/i.test(base);
    if(!toolLike) return;
    function hasSession(){
      try{
        var s=JSON.parse(localStorage.getItem('a_tuls_session')||'null');
        return !!(s && (s.id||s.email||s.username));
      }catch(e){ return false; }
    }
    if(hasSession()) return;
    document.addEventListener('DOMContentLoaded', function(){
      if(hasSession()) return;
      // GitHub Pages: still require login, but show clear message with relative login link
      var bar=document.createElement('div');
      bar.id='atulsApiLockBar';
      bar.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(3,7,18,.92);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui';

      document.body.appendChild(bar);
    });
  }catch(e){}
})();
