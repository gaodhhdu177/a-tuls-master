<script>
/* ===== Session: 10 min idle + browser-tab session ===== */
(function(){
  var IDLE_MS = 10 * 60 * 1000; // 10 minutes
  var KEY_ACT = 'a_tuls_last_activity';
  var KEY_TAB = 'a_tuls_tab_session';

  function touch() {
    try { localStorage.setItem(KEY_ACT, String(Date.now())); } catch(e) {}
  }

  function ensureTabSession() {
    // sessionStorage clears when browser is fully closed
    try {
      if (!sessionStorage.getItem(KEY_TAB)) {
        // New browser session after close — force re-login unless on index
        var role = localStorage.getItem('a_tuls_role');
        if (role && role !== '') {
          // Mark tab; first page after browser open keeps role only if activity fresh
          sessionStorage.setItem(KEY_TAB, '1');
        } else {
          sessionStorage.setItem(KEY_TAB, '1');
        }
      }
    } catch(e) {}
  }

  function checkIdle() {
    try {
      var last = parseInt(localStorage.getItem(KEY_ACT) || '0', 10);
      if (!last) { touch(); return true; }
      if (Date.now() - last > IDLE_MS) {
        localStorage.removeItem('a_tuls_role');
        localStorage.removeItem('a_tuls_user');
        localStorage.removeItem(KEY_ACT);
        try { sessionStorage.removeItem(KEY_TAB); } catch(e) {}
        return false;
      }
      return true;
    } catch(e) { return true; }
  }

  // On protected pages only — index should not force logout loop
  var path = (location.pathname || '').toLowerCase();
  var isAuthPage = path.indexOf('index') >= 0 || path.endsWith('/') || path === '';
  if (!isAuthPage) {
    ensureTabSession();
    if (!checkIdle()) {
      location.replace('index.html');
      return;
    }
    touch();
    ['click','keydown','mousemove','scroll','touchstart'].forEach(function(ev){
      document.addEventListener(ev, function(){ touch(); }, { passive: true });
    });
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) {
        if (!checkIdle()) location.replace('index.html');
        else touch();
      }
    });
    setInterval(function(){
      if (!checkIdle()) location.replace('index.html');
    }, 30000);
  } else {
    // Login page: if still within idle and has role, optional auto-redirect is existing logic
    touch();
  }
})();
</script>

/* Device fingerprint for block check */
function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h).toString(36);
}

function getFingerprint() {
    const parts = [
        navigator.userAgent,
        navigator.language,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || ''
    ].join('|');
    return simpleHash(parts);
}
