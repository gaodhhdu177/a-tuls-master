/* A_TULS_DOMAIN_LOCK — Render + Cloudflare + Netlify + Vercel */
(function(){
  try{
    var host = (location.hostname||'').toLowerCase();
    var proto = (location.protocol||'').toLowerCase();
    var ok = (
      host === 'a-tuls-master-n0k1.onrender.com' ||
      host.endsWith('.onrender.com') ||
      host.endsWith('.pages.dev') ||
      host.endsWith('.netlify.app') ||
      host.endsWith('.vercel.app')
    );
    if(proto === 'file:' || !host || !ok){
      document.documentElement.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:48px 24px;text-align:center;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center"><h1 style="font-size:1.75rem;margin:0 0 12px">Access Denied</h1><p style="opacity:.9;margin:0 0 8px">This page only works on the official A-Tuls domain.</p><p style="opacity:.55;margin:0;font-size:.9rem">Render / Cloudflare Pages / Netlify / Vercel</p></div>';
      throw new Error('domain-lock');
    }
  }catch(e){ if(String(e.message||e)==='domain-lock'||(e&&e.message==='domain-lock')) throw e; }
  try{
    document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
    document.addEventListener('keydown',function(e){
      if(e.key==='F12' || (e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C')) || (e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S'))){
        e.preventDefault(); e.stopPropagation(); return false;
      }
    }, true);
  }catch(e){}
})();
</script>
