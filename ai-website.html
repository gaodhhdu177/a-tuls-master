<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){try{var h=(location.hostname||'').toLowerCase();var p=(location.protocol||'').toLowerCase();var ok=h.endsWith('.onrender.com')||h.endsWith('.pages.dev')||h.endsWith('.netlify.app')||h.endsWith('.vercel.app')||h.endsWith('.workers.dev');if(p==='file:'||!h||!ok){document.documentElement.innerHTML='<div style="padding:48px;text-align:center;background:#000;color:#fff;min-height:100vh">Access Denied</div>';throw new Error('x');}}catch(e){if(String(e.message)==='x')throw e;}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Website · A-Tuls</title>
<link rel="icon" href="logo.png">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#030b16;color:#f0f6fc;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px}
.card{background:rgba(10,25,47,.85);border:1px solid rgba(0,229,255,.2);border-radius:18px;padding:18px}
textarea,input{width:100%;box-sizing:border-box;background:#050f1d;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:12px;margin:8px 0}
button{background:linear-gradient(135deg,#00e5ff,#3a86ff);border:0;color:#031018;font-weight:800;padding:12px 18px;border-radius:12px;cursor:pointer}
a{color:#00e5ff}
h1{font-size:1.25rem;margin:0 0 8px}
.muted{color:#8b949e;font-size:.9rem;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>AI Website</h1>
    <p class="muted">A-Tuls AI Website helper — outline for your site idea.</p>
    <label>Describe your website idea</label>
<textarea id="idea" rows="4" placeholder="e.g. portfolio for photographer"></textarea>
<button type="button" onclick="go()">Generate outline</button>
<pre id="out" style="margin-top:12px;white-space:pre-wrap;color:#8b949e"></pre>
<script>
function go(){
  var i=(document.getElementById('idea').value||'my site').trim();
  document.getElementById('out').textContent='AI Website outline for: '+i+'\n\n1. Hero with logo + headline\n2. About section\n3. Services / tools cards\n4. Contact (WhatsApp)\n5. Footer\n\nTip: Use Bio Link Website for a simple link hub.';
}
</script>
    <p style="margin-top:16px"><a href="dashboard.html">← Dashboard</a></p>
  </div>
</div>
</body>
</html>
